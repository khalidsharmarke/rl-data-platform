[project]
name = "rl-data-platform"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic-settings==2.7.0",
    "pyjwt==2.10.1",
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Fixture environments contain their own test_*.py graders; they run in the sandbox, not here.
norecursedirs = ["fixtures"]
markers = ["sandbox: needs the Docker daemon; runs in the sandbox service (make test)"]
