# The scripted demo: `make demo`. Runs the platform on the demo clock and adds the simulator.
services:
  api:
    environment:
      DEMO_CLOCK_SPEED: "180"
      SCORECARD_BUCKET_MINUTES: "15"
      VENDOR_GOLD_REFRESH_MINUTES: "60"
      SEED_SAMPLE_PROJECT: "false"

  worker:
    environment:
      DEMO_CLOCK_SPEED: "180"
      SCORECARD_BUCKET_MINUTES: "15"
      VENDOR_GOLD_REFRESH_MINUTES: "60"
      JOBS_TICK_SECONDS: "3"

  sandbox:
    environment:
      DEMO_CLOCK_SPEED: "180"

  simulator:
    build: ./simulator
    profiles: ["demo"]
    environment:
      API_URL: http://api:8000
      DEMO_CLOCK_SPEED: "180"
      # Set DEMO_AUTOPILOT=false to make the admin's and data ops' decisions by hand.
      DEMO_AUTOPILOT: ${DEMO_AUTOPILOT:-true}
    volumes:
      - ./backend/app/demo_content.py:/sim/demo_content.py:ro
      - ./backend/tests/fixtures/environments:/sim/environments:ro
      # Harbor's CI uses the same vendor CLI and registry client a vendor would.
      - ./tools/rlp.py:/sim/rlp.py:ro
      - ./backend/app/oci.py:/sim/oci.py:ro
    depends_on:
      - api

  # A stand-in for training infrastructure: pulls each newly approved environment from the catalog.
  training:
    build: ./simulator
    command: python training.py
    environment:
      API_URL: http://api:8000
      TRAINING_TOKEN: dev-only-training-token
    restart: unless-stopped
    depends_on:
      - api
