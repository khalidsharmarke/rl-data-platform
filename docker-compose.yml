services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rl
      POSTGRES_PASSWORD: rl
      POSTGRES_DB: rl
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rl -d rl"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://rl:rl@db:5432/rl
      JWT_SECRET: dev-only-not-a-secret
      DEMO_LOGINS: "true"
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://rl:rl@db:5432/rl
    command: python -m app.jobs
    # Starts alongside the API, which runs migrations first; retry until they're in place.
    restart: unless-stopped
    volumes:
      - ./backend:/app
    depends_on:
      - api

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
