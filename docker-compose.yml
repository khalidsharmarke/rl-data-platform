services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rl
      POSTGRES_PASSWORD: rl
      POSTGRES_DB: rl
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rl -d rl"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://rl:rl@db:5432/rl
      JWT_SECRET: dev-only-not-a-secret
      DEMO_LOGINS: "true"
      DETECTION_TOKEN: dev-only-detection-token
      TRAINING_TOKEN: dev-only-training-token
      REGISTRY_URL: http://registry:5000
      REGISTRY_PLATFORM_SECRET: dev-only-registry-secret
      GENERATOR_TOKEN: rlp1_dev-only-generator-token
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - objects:/data
      - registry-keys:/registry-keys
      - ./tools:/tools:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://rl:rl@db:5432/rl
    command: python -m app.jobs
    # Starts alongside the API, which runs migrations first; retry until they're in place.
    restart: unless-stopped
    volumes:
      - ./backend:/app
    depends_on:
      - api

  # The detection service (AB13, D23): a separate process that only talks to the API.
  detection:
    build: ./detection
    environment:
      API_URL: http://api:8000
      DETECTION_TOKEN: dev-only-detection-token
    restart: unless-stopped
    volumes:
      - ./detection:/detection
    depends_on:
      - api

  # The reward-hack detector (TO3, D35): a second black box behind its own contract.
  hack-detection:
    build: ./detection
    command: python hack_service.py
    environment:
      API_URL: http://api:8000
      DETECTION_TOKEN: dev-only-detection-token
    restart: unless-stopped
    volumes:
      - ./detection:/detection
    depends_on:
      - api

  # The base image every environment check runs on (B4). Built, never run as a service.
  env-image:
    build: ./sandbox/env-image
    image: rl-env-python:1
    command: ["true"]
    restart: "no"

  # The sandbox runner (D4, B5): claims validation jobs and starts a locked-down container per
  # check through the host's Docker daemon. Daemon access is host-level power: laptop only.
  sandbox:
    build:
      context: ./backend
      dockerfile: ../sandbox/runner.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://rl:rl@db:5432/rl
      REGISTRY_URL: http://registry:5000
      REGISTRY_PLATFORM_SECRET: dev-only-registry-secret
    command: python -m app.sandbox
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - objects:/data
      - registry-keys:/registry-keys
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api
      - env-image
      - registry

  # The code task generator (EC7, D48): a client of the platform with its own API token, filling
  # every environment brief allocated to it. Idle until one is.
  generator:
    build: ./generator
    environment:
      API_URL: http://api:8000
      GENERATOR_TOKEN: rlp1_dev-only-generator-token
    restart: unless-stopped
    volumes:
      - ./generator:/gen
      - ./tools/rlp.py:/gen/rlp.py:ro
    depends_on:
      - api

  # The container registry (VM2, D50): a namespace per vendor, signed in to with a vendor API
  # token through the API's token endpoint. It trusts the key the API creates on first start.
  registry:
    image: registry:3.1.0
    entrypoint: ["sh", "-c", "until [ -f /keys/jwks.json ]; do sleep 1; done; exec registry serve /etc/distribution/config.yml"]
    volumes:
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - registry-keys:/keys:ro
      - registry-data:/var/lib/registry
    ports:
      - "5000:5000"

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  registry-keys:
  registry-data:
  # Object storage stand-in: exported datasets.
  objects:
